[project]
name = "phish-check"
version = "0.1.0"
description = "Analyze a suspicious email for phishing: extract & defang IOCs, enrich via Crimson Crawler, get an LLM verdict with feed citations."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Def-Logix" }]
keywords = ["phishing", "email", "security", "ioc", "threat-intelligence", "cli"]
dependencies = [
    "httpx>=0.28",
    "openai>=1.60",
    "rich>=13.0",
    "beautifulsoup4>=4.12",
    "tldextract>=5.0",
    "python-dotenv>=1.0",
]

[project.scripts]
phish-check = "phish_check.cli:main"

[project.urls]
Homepage = "https://crimsoncrawler.com"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
# Pinned exactly, not floored. This requirement is not part of uv.lock — uv locks
# runtime dependencies, not build-time ones — and it is *executed* on every
# install, editable ones included. Left unconstrained, "uv sync installs the
# exact versions in the lockfile" would be untrue of the one package that runs
# code during installation, and the same commit could build differently over time.
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phish_check"]

# Without this, hatchling's default sdist sweeps in everything not gitignored —
# tests and the sample corpus included. Keep a source distribution to the package
# plus the files that state its terms.
# Patterns are gitignore-style, so they match by basename at any depth unless
# anchored with a leading "/": bare "README.md" also pulled in
# sample-emails/README.md, shipping a guide to samples the sdist doesn't contain.
[tool.hatch.build.targets.sdist]
include = [
    "/phish_check",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/THIRD-PARTY-NOTICES.md",
    "/SECURITY.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
